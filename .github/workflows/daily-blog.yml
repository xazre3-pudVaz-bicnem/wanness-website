name: Daily blog post

on:
  schedule:
    # 毎日 11:50 JST（= 02:50 UTC）
    - cron: "50 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate daily post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # リポジトリのVariablesで ANTHROPIC_MODEL を設定するとモデルを上書きできる
          # （未設定時は claude-haiku-4-5-20251001 を使用。ログにモデル名が出力される）
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: npx tsx scripts/generate-daily-post.ts

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/column
          if git diff --cached --quiet; then
            echo "変更なし（新規記事は生成されませんでした）"
          else
            FILE=$(git diff --cached --name-only)
            git commit -m "blog: 自動生成記事を追加 ($(date +%Y-%m-%d))"
            git push
            echo "pushed: $FILE"
          fi
